name: release-center-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build commands
        run: go build -buildvcs=false ./cmd/server ./cmd/releasectl ./cmd/migrate
      - name: Resource catalog smoke
        run: go run ./cmd/releasectl resource-catalog

  windows-go-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows Go package smoke
        shell: pwsh
        run: |
          $env:BUILD_CENTER_PROJECT = "release-center"
          $env:BUILD_RUN_ID = "ci-smoke"
          $env:VERSION_NAME = "0.1.0"
          $env:VERSION_CODE = "1"
          $env:CHANNEL = "ci"
          .\scripts\package-windows-go.ps1 -MainPackage .\cmd\releasectl -BinaryName releasectl
          if (-not (Test-Path .\dist\windows\releasectl.exe)) { throw "missing releasectl.exe" }
          if (-not (Test-Path .\dist\windows\release-center-0.1.0-windows-amd64.zip)) { throw "missing windows archive" }
          if (-not (Test-Path .\dist\windows\windows-artifact-manifest.json)) { throw "missing manifest" }
