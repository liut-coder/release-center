name: release-center-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build commands
        run: go build -buildvcs=false ./cmd/server ./cmd/releasectl ./cmd/migrate
      - name: Resource catalog smoke
        run: go run ./cmd/releasectl resource-catalog
